<!doctype html> 
<html lang="ja"> 
<head> 
  <meta charset="utf-8"> 
  <meta name="viewport" 
        content="width=device-width, initial-scale=1"> 
  <title>はじめてのAR</title> 
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/gh/AR-js-
org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script> 
  <style> 
    body { margin: 0; overflow: hidden; } 
  </style> 
</head> 
<body> 
  <a-scene embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false"> 
    
        <a-marker preset="hiro">

      <!-- 白い丸い体 -->
      <a-sphere
        position="0 0.55 0"
        radius="0.45"
        material="color: #FFFFFF; shader: flat;">
      </a-sphere>

      <!-- 左目 -->
      <a-sphere
        position="-0.14 0.68 0.40"
        radius="0.035"
        material="color: #222222; shader: flat;">
      </a-sphere>

      <!-- 右目 -->
      <a-sphere
        position="0.14 0.68 0.40"
        radius="0.035"
        material="color: #222222; shader: flat;">
      </a-sphere>

      <!-- くちばし -->
      <a-cone
        position="0 0.57 0.46"
        radius-bottom="0.08"
        radius-top="0"
        height="0.10"
        rotation="90 0 0"
        material="color: #222222; shader: flat;">
      </a-cone>

      <!-- 左側の黒い羽 -->
      <a-sphere
        position="-0.38 0.25 0.05"
        radius="0.18"
        scale="0.7 1.5 0.4"
        rotation="0 0 35"
        color="#333333">
      </a-sphere>
      
      <!-- 右側の黒い羽 -->
      <a-sphere
        position="0.38 0.25 0.05"
        radius="0.18"
        scale="0.7 1.5 0.4"
        rotation="0 0 -35"
        color="#333333">
      </a-sphere>

    
    </a-marker> 
    <a-entity camera></a-entity> 
  </a-scene> 
</body> 
</html>
