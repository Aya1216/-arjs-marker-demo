<!doctype html> 
<html lang="ja"> 
<head> 
  <meta charset="utf-8"> 
  <meta name="viewport" 
        content="width=device-width, initial-scale=1"> 
  <title>はじめてのAR</title> 
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/gh/AR-js-
org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script> 
  <style> 
    body { margin: 0; overflow: hidden; } 
  </style> 
</head> 
<body> 
  <a-scene embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false"> 
    
        <a-marker type="pattern" url="simaenaga.patt">

      <!-- 白い丸い体 -->
      <a-sphere
        position="0 0.55 0"
        radius="0.45"
        color="#FFFFFF">
      </a-sphere>

      <!-- 左目 -->
      <a-sphere
        position="-0.14 0.68 0.40"
        radius="0.035"
        color="#222222">
      </a-sphere>

      <!-- 右目 -->
      <a-sphere
        position="0.14 0.68 0.40"
        radius="0.035"
        color="#222222">
      </a-sphere>

      <!-- くちばし -->
      <a-cone
        position="0 0.57 0.46"
        radius-bottom="0.08"
        radius-top="0"
        height="0.10"
        rotation="90 0 0"
        color="#222222">
      </a-cone>
      <!-- 左側のほっぺ -->
      <a-sphere
        position="-0.28 0.6 0.35"
        radius="0.05"
        scale="1 1 0.3"
        rotation="0 0 30"
        color="#F8C9B5">
      </a-sphere>
      
      <!-- 右側のほっぺ -->
      <a-sphere
        position="0.28 0.6 0.35"
        radius="0.05"
        scale="1 1 0.3"
        rotation="0 0 -30"
        color="#F8C9B5">
      </a-sphere>

      <!-- 左側の羽 -->
      <a-sphere
        position="-0.40 0.35 0.05"
        radius="0.2"
        scale="0.5 1.0 0.5"
        rotation="0 0 25"
        color="#45413D">
      </a-sphere>
      
      <!-- 右側の羽 -->
      <a-sphere
        position="0.40 0.35 0.05"
        radius="0.2"
        scale="0.5 1.0 0.5"
        rotation="0 0 -25"
        color="#45413D">
      </a-sphere>
          
    </a-marker> 
    <a-entity camera></a-entity> 
  </a-scene> 
</body> 
</html>
