<!doctype html> 
<html lang="ja"> 
<head> 
  <meta charset="utf-8"> 
  <meta name="viewport" 
        content="width=device-width, initial-scale=1"> 
  <title>はじめてのAR</title> 
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script> 
  <script src="https://cdn.jsdelivr.net/gh/AR-js-
org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script> 
  <style> 
    body { margin: 0; overflow: hidden; } 
  </style> 
</head> 
<body> 
  <a-scene embedded 
    arjs="sourceType: webcam; debugUIEnabled: false;" 
    vr-mode-ui="enabled: false"> 
    <a-marker preset="hiro"> 
      <a-sphere
    position="0 0.5 0"
    radius="0.5"
    color="#FF0000">
  </a-sphere>
      <a-cylinder
  position="0 1.1 0"
  radius="0.04"
  height="0.2"
  color="654321">
</a-cylinder>

  <a-cone
  position="0.18 1.12 0"
  radius-bottom="0.08"
  radius-top="0"
  height="0.3"
  rotation="0 0 -90"
  color="#228B22">
</a-cone>
    </a-marker> 
    <a-entity camera></a-entity> 
  </a-scene> 
</body> 
</html>
